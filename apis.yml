name: Cx2
description: CX2 is a defense technology company building AI-enabled electromagnetic
  spectrum (electronic warfare) systems for the tactical edge. Founded in 2024 and
  headquartered in El Segundo, California, CX2 develops attritable, machine-learning-powered
  hardware and software that detect, disrupt, and geolocate RF threats across land,
  air, sea, and space. Its flagship products are Wraith, a roughly 32-pound autonomous
  airborne EW platform that geolocates and identifies hostile emitters such as jammers
  and radars in GPS-denied environments, and Vadris, an RF-seeking payload for FPV
  drones that hunts ground control stations and other emitters of interest. CX2 is
  backed by 8VC, Point72 Ventures, Andreessen Horowitz, and others, and sells directly
  to military and government customers. It does not currently publish a public API
  or developer portal.
